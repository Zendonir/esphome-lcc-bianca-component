name: Compile test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('.github/workflows/compile.yml') }}

      - name: Install ESPHome
        run: pip install esphome==2026.6.5

      - name: Compile
        run: esphome compile tests/test.yaml
